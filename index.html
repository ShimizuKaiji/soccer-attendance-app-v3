<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サッカーチーム出欠管理アプリ v3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>サッカーチーム出欠管理 v3</h1>
      <p>日付ごとに出欠を分けて，毎日の練習・試合ごとに管理できます．</p>
    </header>

    <section class="form-area">
      <h2>日付・活動内容</h2>
      <p class="notice">v3では，日付ごとに出欠一覧を分けて表示します．別の日を選ぶと，その日の出欠だけを確認できます．</p>

      <input type="date" id="dateInput">
      <input type="text" id="activityInput" placeholder="活動内容を入力（例：練習，試合，練習試合）">
    </section>

    <section class="summary">
      <div class="card">
        <span>出席</span>
        <strong id="presentCount">0</strong>
      </div>
      <div class="card">
        <span>欠席</span>
        <strong id="absentCount">0</strong>
      </div>
      <div class="card">
        <span>遅刻</span>
        <strong id="lateCount">0</strong>
      </div>
    </section>

    <section class="form-area">
      <h2>出欠を登録</h2>

      <input type="text" id="nameInput" placeholder="名前を入力">

      <select id="statusInput">
        <option value="出席">出席</option>
        <option value="欠席">欠席</option>
        <option value="遅刻">遅刻</option>
      </select>

      <textarea id="commentInput" placeholder="理由・コメントを入力"></textarea>

      <button id="addButton">登録する</button>
    </section>

    <section class="list-area">
      <h2 id="listTitle">出欠一覧</h2>
      <ul id="attendanceList"></ul>
    </section>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
